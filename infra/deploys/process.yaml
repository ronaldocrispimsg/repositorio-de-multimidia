---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: repositorio-multimidia-process-audio-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repositorio-multimidia-process-audio
  minReplicaCount: 0
