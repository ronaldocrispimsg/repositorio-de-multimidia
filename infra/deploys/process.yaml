apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
type: Opaque
stringData:
  # PLACEHOLDER: não versionar a senha real. Antes do deploy, crie/atualize o Secret
  # fora do Git (kubectl create secret generic rabbitmq-secret --from-literal=host=<amqp-url>)
  # ou use SealedSecrets/SOPS. Formato: amqp://multimidia:<SENHA>@rabbitmq.default.svc.cluster.local:5672/
  host: "amqp://multimidia:CHANGE_ME@rabbitmq.default.svc.cluster.local:5672/"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: host
      name: rabbitmq-secret
      key: host
---
# ==============================================================================
# 1. WORKER ROUTER (file.uploaded -> {video,audio,image}.uploaded | file.rejected)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repositorio-multimidia-process-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repositorio-multimidia-process-router
  template:
    metadata:
      labels:
        app: repositorio-multimidia-process-router
    spec:
      nodeSelector:
        role: processor
      containers:
        - name: process-router
          image: repositorio-multimidia-process:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_TYPE
              value: "router"
            - name: RABBIT_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: host
            - name: FILER_URL
              value: "http://filer.default.svc.cluster.local:8888"
            - name: TMP_DOWNLOADS
              value: "/tmp/videos_download"
            - name: CLEAN_TMP
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp-work
              mountPath: /tmp
      volumes:
        - name: tmp-work
          emptyDir: {}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: repositorio-multimidia-process-router-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repositorio-multimidia-process-router
  minReplicaCount: 1          # Router mantém 1 réplica ativa para classificar uploads imediatamente (sem cold start)
  maxReplicaCount: 5
  cooldownPeriod: 60
  pollingInterval: 10
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: file.uploaded
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: rabbitmq-trigger-auth
---
# ==============================================================================
# 2. WORKER DE VÍDEO (video.uploaded -> HLS -> video.ready | video.failed)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: repositorio-multimidia-process-video
spec:
  replicas: 0
  selector:
    matchLabels:
      app: repositorio-multimidia-process-video
  template:
    metadata:
      labels:
        app: repositorio-multimidia-process-video
    spec:
      nodeSelector:
        role: processor
      containers:
        - name: process-video
          image: repositorio-multimidia-process:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKER_TYPE
              value: "video"
            - name: RABBIT_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: host
            - name: FILER_URL
              value: "http://filer.default.svc.cluster.local:8888"
            - name: TMP_HLS
              value: "/tmp/hls"
            - name: TMP_DOWNLOADS
              value: "/tmp/videos_download"
            - name: CLEAN_TMP
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: tmp-work
              mountPath: /tmp
      volumes:
        - name: tmp-work
          emptyDir: {}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: repositorio-multimidia-process-video-scaledobject
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repositorio-multimidia-process-video
  minReplicaCount: 0          # Escala a 0 quando não há vídeos para transcodificar
  maxReplicaCount: 10         # Limite máximo de réplicas simultâneas de FFmpeg (HLS)
  cooldownPeriod: 60
  pollingInterval: 15
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: video.uploaded # Fila escutada pelo worker Node.js (amqplib)
        mode: QueueLength
        value: "1"                # 1 vídeo por pod (FFmpeg HLS usa bastante CPU)
      authenticationRef:
        name: rabbitmq-trigger-auth
---
# ==============================================================================
# 3. WORKER DE ÁUDIO (audio.uploaded -> AAC/MP3 -> audio.ready | audio.failed)
# ==============================================================================
