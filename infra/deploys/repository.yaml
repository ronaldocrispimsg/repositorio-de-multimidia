apiVersion: apps/v1
kind: Deployment
metadata:
  name: repositorio-multimidia-repository
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repositorio-multimidia-repository
  template:
    metadata:
      labels:
        app: repositorio-multimidia-repository
    spec:
      containers:
        - name: repository
          image: repositorio-multimidia-repository:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8001"
            - name: FILER_URL
              value: "http://filer.default.svc.cluster.local:8888"
          ports:
            - containerPort: 8001
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: repository
  namespace: default
spec:
  selector:
    app: repositorio-multimidia-repository
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      name: http
